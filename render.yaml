# Render Blueprint for ContractMap. Render dashboard -> New -> Blueprint -> pick this repo (branch main).
# You are asked for the four secrets marked "sync: false"; everything else is set here.
services:
  # ---------------- Backend API (FastAPI) ----------------
  # Uses ~450 MB of memory (road network, traffic model, ML models), so it needs the Standard plan (2 GB).
  - type: web
    name: contractmap-api
    runtime: python
    plan: standard
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI            # secret: MongoDB Atlas connection string
        sync: false
      - key: MONGO_DB
        value: gridlock
      - key: GEMINI_API_KEY       # secret
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_S
        value: "20"
      - key: NOMINATIM_EMAIL      # secret: contact email for the address lookup service
        sync: false
      # Browsers may call the API only from the ContractMap site. The pattern accepts whatever Render address the
      # site gets (contractmap-site.onrender.com, or contractmap-site-xxxx.onrender.com if that name is taken);
      # localhost:5500 keeps local testing working.
      - key: CORS_ORIGINS
        value: http://localhost:5500
      - key: CORS_ORIGIN_REGEX
        value: https://contractmap-site(-[a-z0-9]+)?\.onrender\.com
      # Load (or compute) traffic congestion for every project at startup so the map is instant.
      - key: GRIDLOCK_WARM_CONGESTION
        value: "1"

  # ---------------- Website: landing page (index.html) + app (app.html) ----------------
  # A static site. config.js is written at build time: the Maps key is never committed, and the API address is
  # taken from the API service above (whatever address Render gives it).
  - type: web
    name: contractmap-site
    runtime: static
    rootDir: frontend
    buildCommand: >-
      printf "window.GRIDLOCK_CONFIG = { apiUrl: 'https://%s', googleMapsApiKey: '%s', googleMapsMapId: 'DEMO_MAP_ID' };\n"
      "$API_HOST" "$MAPS_KEY" > config.js && echo "config.js written, apiUrl https://$API_HOST"
    staticPublishPath: .
    headers:
      # Pages and scripts are re-checked on every visit, so a new deploy shows up immediately.
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: API_HOST             # e.g. contractmap-api.onrender.com, filled in by Render from the API service
        fromService:
          type: web
          name: contractmap-api
          property: host
      - key: MAPS_KEY             # secret: Google Maps JavaScript API key
        sync: false
