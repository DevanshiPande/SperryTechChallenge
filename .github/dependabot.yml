# Weekly update PRs for Python packages and the GitHub Actions used in .github/workflows.
# No Docker entry: the app has no Dockerfile (Render builds it as a native Python service).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
